name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Engine assertions (zero dependencies)
        run: python eval.py
      - name: AgentGuard detection layer (zero dependencies)
        run: python test_agentguard.py
      - name: China AI gateway deploy-path regression (child process, random PORT)
        run: python test_chinaai_service.py
      - name: CLI smoke
        run: python -m auditpilot audit examples/statement_clean.csv
      - name: Gradio app import (main branch, ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install -r requirements.txt
          python -c "import app; print('gradio app builds OK')"
